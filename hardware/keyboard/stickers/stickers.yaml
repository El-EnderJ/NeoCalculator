# NeoCalculator keycap stickers — configuration for make_stickers.py
# Lengths in millimetres. Paths relative to the repository root unless noted.

sources:
  # Canonical keypad layout; the firmware header is generated from it.
  layout_json: hardware/keyboard/neocalculator-v1-final-5x10-revision-c-canonical.json
  # Generated firmware keymap: every printed legend is cross-checked against it.
  firmware_keymap: src/input/generated/ProductionKeypadMap.generated.h
  firmware_src: src
  key_stl: hardware/enclosure/key.stl

# ── Key geometry ────────────────────────────────────────────────────────────
# MEASURED from hardware/enclosure/key.stl (not placeholders): flat top face at
# z = 5.029 mm, 10.730 x 8.330 mm, corner radius 1.765 mm (circle fit on the 104
# corner-arc vertices, max error 0.0001 mm). Cross-checked against the 50
# identical 11.2 x 8.8 mm openings in case-top.stl (13.2 x 9.8 mm pitch, same as
# the PCB switch pitch). One key size for all 50 keys.
# Re-check:  python hardware/keyboard/stickers/make_stickers.py --measure
key_top:
  width: 10.73
  height: 8.33
  corner_radius: 1.765

sticker:
  inset: 0.4             # per side, so the edges don't lift
  corner_radius: auto    # auto = key corner radius - inset
  edge_padding: 0.48     # minimum distance from a straight sticker edge to any ink
  corner_clearance: 0.40 # minimum distance from the rounded corners to any ink
  outline_pt: 0.3        # cut line: hairline in a darker shade of the sticker colour
  outline_darken: 0.20

# ── Type ────────────────────────────────────────────────────────────────────
# Noto Sans (variable: weight + width axes) for words, digits and arithmetic keys;
# Noto Sans Math for arrows it lacks (emboldened to the same stem weight).
# Mathematical legends use TeX / Computer Modern instead: see `tex:` below.
# Text is converted to outlines and shaped with HarfBuzz (kerning, 'case').
# Paths relative to this folder. Subsets of the OFL fonts, see fonts/OFL.txt.
fonts:
  upright: fonts/NotoSans-VF.subset.ttf
  italic:  fonts/NotoSans-Italic-VF.subset.ttf
  math:    fonts/NotoSansMath.subset.ttf

typography:
  # Size is given as cap height in mm. Members of a "uniform" role all share one
  # size (set by the one that needs the most room), so a row of keys reads evenly.
  # Width is reduced in real typographic steps (font width axis) before any size
  # is given up; letters are never stretched or squeezed artificially.
  width_steps: [100, 93.75, 87.5, 81.25, 75, 68.75, 62.5]
  roles:
    digit: {cap: 3.55, weight: 600, width: 100,  min_width: 100,  uniform: true,  align: cap}   # 0–9
    op:    {cap: 4.30, weight: 600, width: 100,  min_width: 100,  uniform: true,  align: ink}   # + − × ÷ = < >
    punct: {cap: 5.20, weight: 700, width: 100,  min_width: 100,  uniform: true,  align: ink}   # , .
    glyph: {cap: 3.55, weight: 600, width: 100,  min_width: 75,   uniform: false, align: ink}   # ( ) π e arrows (−)
    func:  {cap: 2.70, weight: 600, width: 100,  min_width: 87.5, uniform: true,  align: cap}   # sin cos tan log ln
    short: {cap: 2.60, weight: 640, width: 100,  min_width: 75,   uniform: true,  align: cap}   # VAR DEL AC EXE
    word:  {cap: 2.25, weight: 640, width: 87.5, min_width: 62.5, uniform: true,  align: cap}   # SHIFT HOME FORMAT …
    math:  {cap: 3.00, weight: 600, width: 100,  min_width: 87.5, uniform: false, align: ink}   # templates, x,t,θ,n
  secondary: {cap: 1.24, weight: 620, width: 93.75, min_width: 62.5, gap: 0.55}
  # Single lowercase letters set in italic (math variables). e, i and π stay upright (ISO 80000-2).
  italic_variables: "xytnθ"
  # Typographic (not functional) fix: ASCII hyphen → true minus sign.
  true_minus: true
  # Force a role for a key: e.g. {r9c3: glyph}
  role_overrides: {}

# Override any legend by key id (r<row>c<col>). Keys: primary / shift / alpha.
label_overrides: {}
print_hidden_legends: false   # true = also print F1–F6 etc. (layout printLegend: false)

# ── Colour ─────────────────────────────────────────────────────────────────
colors:
  ink: "#1B1D21"
  ink_on_dark: "#FAFAF7"
  shift: "#9A5B00"           # SHIFT legend (layout JSON: amber, upper-left)
  shift_on_dark: "#F6BE5A"
  alpha: "#C23B12"           # ALPHA legend (layout JSON: orange, upper-right)
  alpha_on_dark: "#FF9C77"
  background:                # light neutral tints per key group, for sorting
    number:     "#F7F5F0"
    operator:   "#E4E9F0"
    function:   "#E6EEE4"
    navigation: "#ECE7F2"
    system:     "#F3E7E2"
    modifier:   "#FFFFFF"
  key_background:            # per-key fills (by primary label)
    SHIFT: "#F2B544"
    ALPHA: "#EE7A4C"
    EXE:   "#2D3640"
  key_ink:
    SHIFT: "#3A2400"
    ALPHA: "#3B1205"

# ── Sheet ──────────────────────────────────────────────────────────────────
page:
  size: [210.0, 297.0]       # A4
  margin: 10.0               # home printers can't print to the edge
  sets: auto                 # as many full keyboard sets as fit (A4: 4)
  min_gap: 3.0               # gap between stickers: as large as fits, within these
  max_gap: 5.0
  set_gap: 9.0
  calibration_mm: 50.0       # discreet scale check under the stickers

fit_test:
  insets: [0.2, 0.4, 0.6]
  sample_keys: [r7c1, r9c3, r3c2, r2c1, r5c0]

output:
  pdf: neocalculator-keycap-stickers.pdf
  fit_test_pdf: neocalculator-keycap-fit-test.pdf
  preview: neocalculator-keycap-stickers-preview.png
  detail: neocalculator-keycap-stickers-detail.png
  preview_dpi: 150
  detail_dpi: 600

# ── TeX math ───────────────────────────────────────────────────────────────
# Mathematical legends (variables, sin/cos/log, x², 10ˣ, √, fractions, π, ≤ …)
# are typeset by matplotlib's mathtext (TeX layout rules) in Computer Modern,
# the LaTeX fonts: 𝑥 is cmmi10 math italic. Words, digits and arithmetic keys
# stay in Noto Sans.
tex:
  enabled: true
  upright_constants: "ei"   # e and i upright (\mathrm); set "" for LaTeX-default italic
  embolden_em: 0.03         # stroke added to Computer Modern so it holds up at keycap size
  min_stroke_mm: 0.085      # minimum added stroke (keeps 1.2 mm secondary legends printable)
  tight_superscripts: true  # x², x⁻¹ spaced like TeX (mathtext sets them a little loose)
  rule_em: 0.045            # fraction bars / radical lines / placeholder boxes
  scale: 1.0
